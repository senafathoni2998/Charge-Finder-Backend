version: "3.9"

services:
  backend:
    image: "${DOCKER_IMAGE:-charge-finder-backend:latest}"
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
